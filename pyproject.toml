[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salience-ledger"
version = "0.3.0"
description = "A deterministic, provenance-first memory control plane for long-running AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Salience Ledger contributors" }]
keywords = ["agents", "memory", "provenance", "context", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
salience = "salience_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salience_ledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
